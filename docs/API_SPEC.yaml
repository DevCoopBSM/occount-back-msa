openapi: 3.0.3
info:
  title: Occount Kiosk Backend API
  description: |
    키오스크 결제 시스템 백엔드 API 명세

    ## 인증 방식
    - **AUTHENTICATED**: `Authorization: Bearer <token>` 헤더 필수
    - **OPTIONAL_AUTH**: 토큰이 있으면 회원으로 처리, 없으면 비회원으로 처리. 잘못된 토큰은 401 반환
    - **PERMIT_ALL**: 인증 불필요
    - **ADMIN_ONLY**: 관리자 권한 토큰 필요

    ## 키오스크 헤더
    - `X-Kiosk-Id`: 주문 생성·취소 시 필수. 키오스크 식별자

    ## 토큰 발급
    - 회원: `POST /api/v3/auth/login`
    - 키오스크 사용자: `POST /api/v3/auth/kiosk/login`
    - 발급된 토큰은 응답 `Authorization` 헤더에 포함됨

  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local (API Gateway)

tags:
  - name: Auth
    description: 회원가입 및 로그인
  - name: Member
    description: 회원 정보 조회
  - name: Item
    description: 상품 조회 및 관리
  - name: AriPick
    description: 아리픽 제안 등록/조회/승인/거절/좋아요
  - name: Order
    description: 주문 생성 및 취소
  - name: Wallet
    description: 포인트 잔액 및 충전 내역
  - name: Inquiry
    description: 1:1 문의 제출 및 조회

paths:
  # ───────────────────────────────────────────────
  # Auth
  # ───────────────────────────────────────────────
  /api/v3/auth/email/send-otp:
    post:
      tags: [Auth]
      operationId: sendEmailOtp
      summary: 이메일 인증번호 발송
      description: 입력된 이메일로 6자리 OTP 인증번호를 발송합니다. 유효시간은 5분입니다. (PERMIT_ALL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailOtpRequest'
            example:
              email: "hong@example.com"
      responses:
        "204":
          description: 인증번호 발송 성공
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/auth/email/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyEmailOtp
      summary: 이메일 인증번호 확인
      description: 발송된 OTP 인증번호를 검증합니다. 성공 시 해당 이메일로 회원가입이 가능합니다. (PERMIT_ALL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailOtpRequest'
            example:
              email: "hong@example.com"
              otp_code: "384921"
      responses:
        "204":
          description: 인증번호 확인 성공
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 인증번호 불일치 또는 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 발송된 인증번호 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/auth/identity/verify:
    post:
      tags: [Auth]
      operationId: verifyIdentity
      summary: 본인인증 검증
      description: PortOne SDK로 완료된 본인인증을 백엔드에서 검증하고, 회원가입에 필요한 사용자 정보를 반환합니다. (PERMIT_ALL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyIdentityRequest'
            example:
              identity_verification_id: "identity-verification-id-from-portone"
      responses:
        "200":
          description: 본인인증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyIdentityResponse'
              example:
                user_ci_number: "CI_HASH_VALUE"
                username: "홍길동"
                user_phone: "01012345678"
                birth_date: "2000-01-15"
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: PortOne 본인인증 실패 또는 미완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 회원가입
      description: 새로운 회원을 등록합니다. (PERMIT_ALL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRegisterRequest'
            example:
              user_ci_number: "CI1234567890"
              username: "홍길동"
              user_phone: "010-1234-5678"
              birth_date: "2000-01-15"
              user_email: "hong@example.com"
              password: "pass1234"
              pin: "1234"
      responses:
        "201":
          description: 회원가입 성공
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 비밀번호 변경 (이메일 인증)
      description: |
        이메일 OTP 인증으로 비밀번호를 재설정합니다. (PERMIT_ALL)

        흐름: `send-otp(purpose=PASSWORD_RESET)` → 사용자가 받은 6자리 코드를 본 요청에 그대로 전달.
        - 변경 시점에 OTP 코드를 직접 재검증하며, PASSWORD_RESET 용도의 OTP만 허용합니다.
        - 가입 여부 노출 방지를 위해, 인증을 통과하면 해당 이메일의 계정 존재 여부와 무관하게 204를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              email: "hong@example.com"
              otp_code: "384921"
              new_password: "newpass1234"
      responses:
        "204":
          description: 비밀번호 변경 성공 (또는 인증 통과·계정 없음 — 동일 응답)
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 인증번호 불일치 또는 잠금
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: PASSWORD_RESET 용도의 발송된 인증번호 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/auth/login:
    post:
      tags: [Auth]
      operationId: memberLogin
      summary: 회원 로그인 (이메일/비밀번호)
      description: |
        이메일과 비밀번호로 로그인합니다. (PERMIT_ALL)
        성공 시 `Authorization: Bearer <token>` 응답 헤더로 JWT 토큰을 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberLoginRequest'
            example:
              email: "hong@example.com"
              password: "pass1234"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Authorization:
              description: "Bearer <JWT 토큰>"
              schema:
                type: string
              example: "Bearer eyJhbGciOiJIUzI1NiJ9.xxx"
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 이메일 또는 비밀번호 불일치

  /api/v3/auth/kiosk/login:
    post:
      tags: [Auth]
      operationId: kioskLogin
      summary: 키오스크 로그인 (바코드/PIN)
      description: |
        학생증 바코드와 PIN 번호로 로그인합니다. (PERMIT_ALL)
        성공 시 `Authorization: Bearer <token>` 응답 헤더로 JWT 토큰을 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskLoginRequest'
            example:
              user_barcode: "20240001"
              user_pin: "1234"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Authorization:
              description: "Bearer <JWT 토큰>"
              schema:
                type: string
              example: "Bearer eyJhbGciOiJIUzI1NiJ9.xxx"
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 바코드 또는 PIN 불일치

  # ───────────────────────────────────────────────
  # Member
  # ───────────────────────────────────────────────
  /api/v3/users:
    get:
      tags: [Member]
      operationId: getAdminUserList
      summary: 사용자 전체 조회 / 검색
      description: |
        관리자가 전체 사용자 목록을 페이지 단위로 조회합니다. (ADMIN_ONLY)

        - `keyword` 를 전달하면 이름(`username`)·이메일(`email`)·조합원번호(`cooperative_number`)
          를 부분일치(OR)로 검색합니다. 공백이거나 생략하면 전체 목록을 조회합니다.
        - 기본 페이지 크기는 10이며 `size` 는 최대 100으로 제한됩니다.
        - 기본 정렬은 `id` 오름차순입니다. 정렬 허용 필드는 `id` 뿐이며, 그 외 필드는 무시되고 기본 정렬이 적용됩니다.
        - 자격증명(비밀번호/PIN)과 CI 등 민감정보는 응답에서 제외됩니다.
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: 이름·이메일·조합원번호 부분일치 검색어 (생략 시 전체 조회)
          schema:
            type: string
          example: "홍길동"
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기 (최대 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
              example:
                users:
                  - id: 1
                    username: "홍길동"
                    email: "hong@example.com"
                    phone: "010-1234-5678"
                    user_type: "STUDENT"
                    role: "ROLE_USER"
                    cooperative_number: "COOP001"
                    user_barcode: "BARCODE123"
                    birth_date: "2000-01-15"
                total_count: 23
                total_pages: 3
                current_page: 0
                page_size: 10
        "401":
          description: 인증 실패
        "403":
          description: 관리자 권한 없음

  /api/v3/users/pre-order-info:
    get:
      tags: [Member]
      operationId: getPreOrderInfo
      summary: 주문 전 회원 정보 조회
      description: |
        주문 화면 진입 시 회원 이름을 반환합니다. (AUTHENTICATED)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreOrderInfoResponse'
              example:
                username: "홍길동"
        "401":
          description: 인증 실패

  /api/v3/users/barcode:
    get:
      tags: [Member]
      operationId: getUserBarcode
      summary: 회원 바코드 조회
      description: |
        로그인한 회원의 바코드를 반환합니다. (AUTHENTICATED)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBarcodeResponse'
              example:
                user_barcode: "BARCODE123"
        "401":
          description: 인증 실패

  /api/v3/users/me:
    get:
      tags: [Member]
      operationId: getMemberInfo
      summary: 본인 회원정보 조회
      description: |
        로그인한 회원 본인의 회원정보를 반환합니다. (AUTHENTICATED)
        자격증명(비밀번호/PIN)과 CI 등 민감정보는 제외됩니다.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInfoResponse'
              example:
                username: "홍길동"
                email: "hong@example.com"
                phone: "010-1234-5678"
                user_type: "STUDENT"
                role: "ROLE_USER"
                cooperative_number: "COOP001"
                birth_date: "2000-01-15"
        "401":
          description: 인증 실패
        "404":
          description: 존재하지 않는 유저

  /api/v3/users/pin/change-ticket:
    post:
      tags: [Member]
      operationId: issuePinChangeTicket
      summary: PIN 변경 1단계 - 비밀번호 확인 및 변경 티켓 발급
      description: |
        PIN 변경을 위해 현재 비밀번호만 먼저 검증하고, 성공 시 새 PIN 제출 단계
        (PUT /users/pin)에서 사용할 1회용 변경 티켓 리소스를 생성합니다. 티켓은 발급받은
        본인에게만 유효하며 짧은 시간(기본 300초) 뒤 만료되고, 사용되면 즉시 폐기됩니다.
        (AUTHENTICATED)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordForPinChangeRequest'
            example:
              password: "pass1234"
      responses:
        "201":
          description: 비밀번호 확인 성공, PIN 변경 티켓 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinChangeTicketResponse'
        "400":
          description: 요청 검증 실패 (비밀번호 누락 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 인증 실패 또는 현재 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 존재하지 않는 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v3/users/pin:
    put:
      tags: [Member]
      operationId: changePin
      summary: PIN 변경 2단계 - 새 PIN 제출
      description: |
        1단계(POST /users/pin/change-ticket)에서 발급받은 1회용 티켓과 새 PIN으로
        키오스크 결제용 PIN을 변경합니다. 티켓은 발급받은 본인에게만 유효하며, 변경이
        완료되면 즉시 소비(폐기)됩니다. (AUTHENTICATED)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
            example:
              ticket: "qY3k...단계1에서_발급된_티켓"
              new_pin: "4321"
      responses:
        "204":
          description: PIN 변경 성공
        "400":
          description: 요청 검증 실패 (PIN 형식 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 인증 실패, 티켓 없음/불일치 또는 티켓 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 존재하지 않는 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────────────────────────────────────────────
  # Item
  # ───────────────────────────────────────────────
  /api/v3/items:
    get:
      tags: [Item]
      operationId: getAllItems
      summary: 전체 상품 목록 조회
      description: 판매 중인 모든 상품 목록을 반환합니다. (PERMIT_ALL)
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'

    post:
      tags: [Item]
      operationId: createItem
      summary: 상품 등록
      description: 새로운 상품을 등록합니다. (ADMIN_ONLY)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        "403":
          description: 관리자 권한 없음

  /api/v3/items/categories:
    get:
      tags: [Item]
      operationId: getItemCategories
      summary: 상품 카테고리 목록 조회
      description: 상품 카테고리 전체 목록을 반환합니다. (PERMIT_ALL)
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCategoryListResponse'

  /api/v3/items/by-ids:
    get:
      tags: [Item]
      operationId: getItemsByIds
      summary: ID 목록으로 상품 조회
      description: 상품 ID 목록을 받아 해당 상품 정보를 반환합니다. (PERMIT_ALL)
      parameters:
        - name: ids
          in: query
          required: true
          description: 조회할 상품 ID 목록
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          example: "1,2,3"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLookupListResponse'

  /api/v3/items/search:
    get:
      tags: [Item]
      operationId: searchItems
      summary: 상품명 풀텍스트 검색
      description: |
        MySQL ngram FULLTEXT 인덱스로 상품명을 검색합니다. 활성 상품만 relevance 내림차순으로 반환합니다. (PERMIT_ALL)

        - 빈/공백 쿼리는 빈 배열을 반환합니다.
        - boolean-mode 메타문자(`+ - > < ( ) ~ * " @`)는 sanitize됩니다.
        - ngram_token_size(기본 2) 미만 길이의 쿼리는 결과가 없습니다.
      parameters:
        - name: q
          in: query
          required: true
          description: 검색어
          schema:
            type: string
          example: "초코"
      responses:
        "200":
