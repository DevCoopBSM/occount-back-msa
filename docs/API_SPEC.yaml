  # ───────────────────────────────────────────────
  # Order
  # ───────────────────────────────────────────────
  /api/v3/orders:
    post:
      tags: [Order]
      operationId: createOrder
      summary: 주문 생성
      description: |
        주문을 생성합니다. (OPTIONAL_AUTH)

        - `X-Kiosk-Id` 헤더는 **필수**입니다. 없으면 400을 반환합니다.
        - 토큰이 있으면 회원 주문, 없으면 비회원 주문으로 처리합니다.
        - 요청 즉시 `PROCESSING` 상태로 응답하며, 실제 처리는 비동기로 수행됩니다.
        - 상품 검증, 가격 확정, 재고 차감은 비동기로 처리됩니다.
        - 재고 부족 또는 상품 검증 실패 시 최종 상태는 `FAILED` 입니다.
        - 최종 결과는 `GET /api/v3/orders/{orderId}/stream` (SSE) 로 실시간 수신하거나,
          `GET /api/v3/orders/{orderId}` 를 폴링하여 확인합니다.
      parameters:
        - name: X-Kiosk-Id
          in: header
          required: true
          description: 키오스크 식별자 (필수)
          schema:
            type: string
          example: "1"
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              items:
                - item_id: 1
                  quantity: 2
      responses:
        "202":
          description: 주문 접수 (PROCESSING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                order_id: 1001
                status: "PROCESSING"
                failure_reason: null
        "400":
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 잘못된 토큰

  /api/v3/orders/statistics/sales-ranking:
    get:
      tags: [Order]
      operationId: getOrderSalesRanking
      summary: 상품 판매량 랭킹 조회
      description: |
        결제 완료된 주문을 기준으로 상품별 판매 수량 합계 랭킹을 조회합니다. (AUTHENTICATED)

        - 판매량은 `COMPLETED` 주문의 주문 상품 `quantity` 합계입니다.
        - `DAILY` 는 기준 날짜 하루, `WEEKLY` 는 기준 날짜가 포함된 월요일~일요일, `MONTHLY` 는 기준 날짜가 포함된 월 전체를 집계합니다.
        - `date` 를 생략하면 서버 기준 오늘 날짜로 집계합니다.
        - 판매 이력이 없는 상품은 주문 데이터만으로 알 수 없으므로 응답에 포함되지 않습니다.
      parameters:
        - name: period
          in: query
          required: true
          description: 집계 기간
          schema:
            $ref: '#/components/schemas/SalesRankingPeriod'
          example: DAILY
        - name: type
          in: query
          required: true
          description: 인기순/비인기순 정렬 기준
          schema:
            $ref: '#/components/schemas/SalesRankingType'
          example: POPULAR
        - name: limit
          in: query
          required: false
          description: 조회할 상품 개수
          schema:
            type: integer
            minimum: 1
            default: 10
          example: 5
        - name: date
          in: query
          required: false
          description: 기준 날짜. 없으면 서버 기준 오늘
          schema:
            type: string
            format: date
          example: "2026-06-05"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 상품 판매량 랭킹 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesRankingResponse'
              example:
                period: DAILY
                type: POPULAR
                limit: 5
                start_date: "2026-06-05"
                end_date: "2026-06-05"
                items:
                  - item_id: 1
                    item_name: "아메리카노"
                    sold_quantity: 123
        "400":
          description: 잘못된 집계 기간, 정렬 기준, 조회 개수 또는 날짜 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 인증 실패

  /api/v3/orders/{orderId}:
    get:
      tags: [Order]
      operationId: getOrder
      summary: 주문 조회
      description: |
        주문 상태를 단건 조회합니다. (PERMIT_ALL)

        - 재고 부족, 상품 미존재 등 재고 단계 실패는 `FAILED` 로 종료됩니다.
        - 최종 상태: `COMPLETED`, `FAILED`, `CANCELLED`, `COMPENSATION_FAILED`, `TIMED_OUT`
        - 실시간 상태 수신이 필요한 경우 `GET /api/v3/orders/{orderId}/stream` (SSE) 를 사용하세요.
      parameters:
        - name: orderId
          in: path
          required: true
          description: 주문 ID
          schema:
            type: integer
            format: int64
          example: 1001
      security:
        - {}
      responses:
        "200":
          description: 주문 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                order_id: 1001
                status: "COMPLETED"
                failure_reason: null
        "404":
          description: 주문을 찾을 수 없음

  /api/v3/orders/{orderId}/stream:
    get:
      tags: [Order]
      operationId: streamOrder
      summary: 주문 상태 실시간 스트리밍 (SSE)
      description: |
        Server-Sent Events(SSE) 방식으로 주문 상태 변경을 실시간 수신합니다. (PERMIT_ALL)

        - 연결 즉시 현재 주문 상태를 전송합니다.
        - 각 메시지는 `event: <event_type>` 형식으로 전달됩니다.
        - 이벤트 타입은 `order_accepted`, `stock_confirmed`, `payment_requested`, `completed`, `failed`, `cancel_requested`, `compensating`, `cancelled`, `compensation_failed`, `timed_out` 중 하나입니다.
        - 주문이 최종 상태(`completed`, `failed`, `cancelled`, `timed_out`)에 도달하면 서버가 연결을 종료합니다.
        - 주문 생성 직후 SSE 연결을 맺어 비동기 처리 결과를 수신하는 용도로 사용합니다.
      parameters:
        - name: orderId
          in: path
          required: true
          description: 주문 ID
          schema:
            type: integer
            format: int64
          example: 1001
      security:
        - {}
      responses:
        "200":
          description: SSE 스트림 연결 성공
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE 메시지는 아래 형식으로 전달됩니다.

                  - `event`: 이벤트 타입
                  - `data`: 이벤트 데이터 (JSON). 모든 이벤트가 `order_id`를 포함하며, 실패 이벤트는 `failure_reason`을 추가로 포함합니다.
                    - 정상: `{"order_id": 1001}`
                    - 실패: `{"order_id": 1001, "failure_reason": "..."}`
              examples:
                accepted:
                  summary: 주문 접수 직후
                  value: |
                    event: order_accepted
                    data: {"order_id": 1001}

                stockConfirmed:
                  summary: 재고 확정 단계
                  value: |
                    event: stock_confirmed
                    data: {"order_id": 1001}

                paymentRequested:
                  summary: 결제 요청 단계
                  value: |
                    event: payment_requested
                    data: {"order_id": 1001}

                completed:
                  summary: 주문 완료
                  value: |
                    event: completed
                    data: {"order_id": 1001}

                failed:
                  summary: 주문 실패
                  value: |
                    event: failed
                    data: {"order_id": 1001, "failure_reason": "재고 부족"}

                cancelled:
                  summary: 주문 취소 완료
                  value: |
                    event: cancelled
                    data: {"order_id": 1001}
        "404":
          description: 주문을 찾을 수 없음

  /api/v3/orders/{orderId}/cancel:
    post:
      tags: [Order]
      operationId: cancelOrder
      summary: 주문 취소
      description: |
        주문을 취소합니다. (OPTIONAL_AUTH)

        - `X-Kiosk-Id` 헤더가 없으면 기본값 `1`을 사용합니다.
        - 주문을 생성한 키오스크와 동일한 `X-Kiosk-Id` 여야 취소가 허용됩니다.
        - 회원/비회원 구분 없이 키오스크 ID만으로 소유권을 검증합니다.
      parameters:
        - name: orderId
          in: path
          required: true
          description: 취소할 주문 ID
          schema:
            type: integer
            format: int64
          example: 1001
        - name: X-Kiosk-Id
          in: header
          required: false
          description: 키오스크 식별자. 없으면 `1`
          schema:
            type: string
            default: "1"
          example: "1"
      security:
        - {}
        - BearerAuth: []
      responses:
        "200":
          description: 취소 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                order_id: 1001
                status: "CANCEL_REQUESTED"
                failure_reason: "사용자에 의해 주문이 취소되었습니다"
        "401":
          description: 잘못된 토큰
        "403":
          description: 다른 키오스크에서 생성된 주문
        "404":
          description: 주문을 찾을 수 없음
        "409":
          description: 취소 불가 상태의 주문

  # ───────────────────────────────────────────────
  # Wallet
  # ───────────────────────────────────────────────
  /api/v3/wallet/point:
    get:
      tags: [Wallet]
      operationId: getWalletPoint
      summary: 포인트 잔액 조회
      description: 로그인한 회원의 현재 포인트 잔액을 반환합니다. (AUTHENTICATED)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPointResponse'
              example:
                point: 3500
        "401":
          description: 인증 실패

  # ───────────────────────────────────────────────
  # Inquiry
  # ───────────────────────────────────────────────
  /api/v3/inquiries:
    post:
      tags: [Inquiry]
      operationId: createInquiry
      summary: 문의 제출
      description: 로그인한 회원이 새로운 문의를 제출합니다. (AUTHENTICATED)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
            example:
              title: "결제가 안돼요"
              content: "포인트 결제 시 오류가 발생합니다."
              category: "PAYMENT"
      responses:
        "201":
          description: 문의 접수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInquiryResponse'
              example:
                inquiry_id: 1
                status: "RECEIVED"
                created_at: "2026-04-28T08:30:00"
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                title: "제목을 입력해주세요."
                category: "카테고리를 선택해주세요."
        "401":
          description: 인증 실패

    get:
      tags: [Inquiry]
      operationId: getInquiryList
      summary: 내 문의 목록 조회
      description: |
        로그인한 회원 본인이 제출한 문의 목록을 페이지 단위로 반환합니다. (AUTHENTICATED)

        - 기본 정렬은 `created_at` 내림차순입니다.
        - 정렬 허용 필드는 `created_at`, `title`, `status`, `category` 이며, 그 외 필드는 무시되고 기본 정렬이 적용됩니다.
        - `size` 는 최대 100으로 제한됩니다.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기 (최대 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: sort
          in: query
          required: false
          description: "정렬 기준 `필드,방향` (허용 필드: created_at, title, status, category)"
          schema:
            type: string
          example: "created_at,desc"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryListResponse'
        "401":
          description: 인증 실패

  /api/v3/inquiries/{inquiryId}:
    get:
      tags: [Inquiry]
      operationId: getInquiryDetail
      summary: 문의 상세 조회
      description: 단건 문의의 상세 내용을 조회합니다. 본인의 문의가 아닌 경우 403을 반환합니다. (AUTHENTICATED)
      security:
        - BearerAuth: []
      parameters:
        - name: inquiryId
          in: path
          required: true
          description: 조회할 문의 ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        "401":
          description: 인증 실패
        "403":
          description: 본인의 문의가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 문의를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <JWT 토큰>"

  schemas:
    # ── Auth ──────────────────────────────────────
    SendEmailOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 인증번호를 받을 이메일
        purpose:
          type: string
          enum: [REGISTER, PASSWORD_RESET]
          default: REGISTER
          description: |
            OTP 용도. 미지정 시 회원가입(REGISTER)으로 간주.
            비밀번호 변경 OTP는 PASSWORD_RESET으로 발송해야 하며,
            발송 시 고정된 용도로만 소비할 수 있습니다.

    VerifyEmailOtpRequest:
      type: object
      required: [email, otp_code]
      properties:
        email:
          type: string
          format: email
          description: 인증번호를 받은 이메일
        otp_code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6자리 인증번호

    VerifyIdentityRequest:
      type: object
      required: [identity_verification_id]
      properties:
        identity_verification_id:
          type: string
          description: PortOne SDK에서 발급된 본인인증 고유 ID

    VerifyIdentityResponse:
      type: object
      properties:
        user_ci_number:
          type: string
          description: 본인인증 CI 값 (회원가입 시 사용)
        username:
          type: string
          description: 실명
        user_phone:
          type: string
          description: 전화번호
        birth_date:
          type: string
          format: date
          nullable: true
          description: 생년월일 (YYYY-MM-DD). 일부 인증사(예 KG이니시스+카카오)에서는 누락될 수 있음

    MemberRegisterRequest:
      type: object
      required: [user_ci_number, username, user_email, password, pin]
      properties:
        user_ci_number:
          type: string
          description: 학생 CI 번호
        username:
          type: string
          maxLength: 55
          description: 이름
        user_phone:
          type: string
          nullable: true
          description: 전화번호
        birth_date:
          type: string
          format: date
          nullable: true
          description: 생년월일 (YYYY-MM-DD). 본인인증 응답에서 받은 값을 그대로 전달
        user_email:
          type: string
          format: email
          description: 이메일
        password:
          type: string
          minLength: 8
          maxLength: 16
          description: 비밀번호 (8~16자)
        pin:
          type: string
          pattern: '^\d{4,6}$'
          description: 키오스크 결제용 PIN (4~6자리 숫자)

    MemberLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    KioskLoginRequest:
      type: object
      required: [user_barcode, user_pin]
      properties:
        user_barcode:
          type: string
          description: 학생증 바코드
        user_pin:
          type: string
          description: PIN 번호

    ChangePasswordRequest:
      type: object
      required: [email, otp_code, new_password]
      properties:
        email:
          type: string
          format: email
          description: 비밀번호를 변경할 계정 이메일
        otp_code:
          type: string
          minLength: 6
          maxLength: 6
          description: PASSWORD_RESET 용도로 발송·검증된 6자리 인증번호
        new_password:
          type: string
          minLength: 8
          maxLength: 16
          description: 새 비밀번호 (8~16자)

    VerifyPasswordForPinChangeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: 본인 확인용 현재 비밀번호

    PinChangeTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          description: 새 PIN 제출(PUT /users/pin) 시 사용할 1회용 티켓
        expires_in:
          type: integer
          format: int64
          description: 티켓 만료까지 남은 시간(초)

    ChangePinRequest:
      type: object
      required: [ticket, new_pin]
      properties:
        ticket:
          type: string
          description: 1단계(POST /users/pin/change-ticket)에서 발급받은 1회용 티켓
        new_pin:
          type: string
          pattern: '^\d{4,6}$'
          description: 새 PIN (4~6자리 숫자)

    # ── Member ─────────────────────────────────────
    UserPreOrderInfoResponse:
      type: object
      properties:
        username:
          type: string
          description: 회원 이름

    MemberInfoResponse:
      type: object
      description: 본인 회원정보. 자격증명(password/pin)과 CI 등 민감정보는 제외됨
      properties:
        username:
          type: string
          description: 이름
        email:
          type: string
          format: email
          description: 이메일
        phone:
          type: string
          nullable: true
          description: 전화번호
        user_type:
          type: string
          enum: [STUDENT, PARENT, TEACHER, OTHER]
          description: 회원 유형
        role:
          type: string
          enum: [ROLE_DEACTIVATED, ROLE_USER, ROLE_MEMBER, ROLE_COOP, ROLE_ADMIN]
          description: 권한
        cooperative_number:
          type: string
          nullable: true
          description: 조합원 번호
        birth_date:
          type: string
          format: date
          nullable: true
          description: 생년월일 (YYYY-MM-DD)

    UserBarcodeResponse:
      type: object
      properties:
        user_barcode:
          type: string
          nullable: true
          description: 회원 바코드

    AdminUserListResponse:
      type: object
      description: 관리자 사용자 목록. 자격증명(password/pin)과 CI 등 민감정보는 제외됨
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummaryResponse'
        total_count:
          type: integer
          format: int64
          description: 전체 사용자 수
        total_pages:
          type: integer
          description: 전체 페이지 수
        current_page:
          type: integer
          description: 현재 페이지 번호 (0부터 시작)
        page_size:
          type: integer
          description: 페이지 크기

    AdminUserSummaryResponse:
      type: object
      description: 관리자 목록의 사용자 항목. 비밀번호/PIN/CI 등 민감정보는 제외됨
      properties:
        id:
          type: integer
          format: int64
          description: 사용자 ID
        username:
          type: string
          description: 이름
        email:
          type: string
          format: email
          description: 이메일
        phone:
          type: string
          nullable: true
          description: 전화번호
        user_type:
          type: string
          enum: [STUDENT, PARENT, TEACHER, OTHER]
          description: 회원 유형
        role:
          type: string
          enum: [ROLE_DEACTIVATED, ROLE_USER, ROLE_MEMBER, ROLE_COOP, ROLE_ADMIN]
          description: 권한
        cooperative_number:
          type: string
          nullable: true
          description: 조합원 번호
        user_barcode:
          type: string
          nullable: true
          description: 회원 바코드
        birth_date:
          type: string
          format: date
          nullable: true
          description: 생년월일 (YYYY-MM-DD)

    # ── Item ───────────────────────────────────────
    ItemListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'

    ItemResponse:
      type: object
      properties:
        item_id:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
          description: 상품 카테고리
        price:
          type: integer
        quantity:
          type: integer
          description: 재고 수량
        barcode:
          type: string
          nullable: true

    ItemLookupListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemLookupResponse'

    ItemLookupResponse:
      type: object
      properties:
        item_id:
          type: integer
          format: int64
        name:
          type: string
        barcode:
          type: string
          nullable: true
        price:
          type: integer
        is_active:
          type: boolean
          description: 판매 활성 여부

    ItemCategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string

    CreateItemRequest:
      type: object
      required: [name, category, price, quantity]
      properties:
        name:
          type: string
        category:
          type: string
          description: 상품 카테고리
        price:
          type: integer
        barcode:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 0

    ItemUpdateRequest:
      type: object
      required: [name, category, price, quantity]
      properties:
        name:
          type: string
        category:
          type: string
        price:
          type: integer
        barcode:
          type: string
          nullable: true
        quantity:
          type: integer

    # ── AriPick ───────────────────────────────────
    CreateAripickRequest:
      type: object
      required: [type_nseq, reason]
      properties:
        type_nseq:
          type: integer
          format: int64
        reason:
          type: string

    AripickFoodSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AripickFoodSearchItemResponse'

    AripickFoodSearchItemResponse:
      type: object
      properties:
        type_nseq:
          type: integer
          format: int64
        name:
          type: string
        company:
          type: string
        kcal_info:
          type: string

    CreateAripickBlockedKeywordRequest:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string

    AripickBlockedKeywordResponse:
      type: object
      properties:
        keyword_id:
          type: integer
          format: int64
        keyword:
          type: string
        registered_date:
          type: string
          format: date

    AripickBlockedKeywordListResponse:
      type: object
      properties:
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/AripickBlockedKeywordResponse'

    AripickListResponse:
      type: object
      properties:
        aripick_items:
          type: array
          items:
            $ref: '#/components/schemas/AripickResponse'

    AripickResponse:
      type: object
      properties:
        proposal_id:
          type: integer
          format: int64
        name:
          type: string
        reason:
          type: string
        proposer_id:
          type: integer
          format: int64
        proposal_date:
          type: string
          format: date
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        like_count:
          type: integer

    AripickLikeToggleResponse:
      type: object
      properties:
        proposal_id:
          type: integer
          format: int64
        liked:
          type: boolean
        like_count:
          type: integer

    AripickStatsResponse:
      type: object
      properties:
        total_proposals:
          type: integer
          format: int64
        approved:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64

    # ── Order ──────────────────────────────────────
    OrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 주문 상품 목록 (`orderInfos` 별칭 허용)
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemRequest:
      type: object
      required: [item_id, quantity]
      properties:
        item_id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    OrderResponse:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
          description: 주문 ID
        status:
          $ref: '#/components/schemas/OrderStatus'
        failure_reason:
          type: string
          nullable: true
          description: 실패/취소 사유

    SalesRankingResponse:
      type: object
      required:
        - period
        - type
        - limit
        - start_date
        - end_date
        - items
      properties:
        period:
          $ref: '#/components/schemas/SalesRankingPeriod'
        type:
          $ref: '#/components/schemas/SalesRankingType'
        limit:
          type: integer
          minimum: 1
        start_date:
          type: string
          format: date
          description: 실제 집계 시작일
        end_date:
          type: string
          format: date
          description: 실제 집계 종료일
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesRankingItemResponse'

    SalesRankingItemResponse:
      type: object
      required:
        - item_id
        - item_name
        - sold_quantity
      properties:
        item_id:
          type: integer
          format: int64
        item_name:
          type: string
          description: 주문 시점 상품명 스냅샷
        sold_quantity:
          type: integer
          format: int64
          description: 해당 기간 동안 판매된 총 수량

    SalesRankingPeriod:
      type: string
      description: |
        판매량 집계 기간.
        - `DAILY` — 기준 날짜 하루
        - `WEEKLY` — 기준 날짜가 포함된 월요일~일요일
        - `MONTHLY` — 기준 날짜가 포함된 월 전체
      enum:
        - DAILY
        - WEEKLY
        - MONTHLY

    SalesRankingType:
      type: string
      description: |
        판매량 랭킹 정렬 기준.
        - `POPULAR` — 많이 팔린 순
        - `UNPOPULAR` — 적게 팔린 순
      enum:
        - POPULAR
        - UNPOPULAR

    OrderStatus:
      type: string
      description: |
        주문 상태 값.

        **최종 상태** (SSE 연결이 자동 종료됨):
        - `COMPLETED` — 주문 완료
        - `FAILED` — 주문 실패 (재고 부족, 상품 미존재 등)
        - `CANCELLED` — 주문 취소 완료
        - `COMPENSATION_FAILED` — 보상 트랜잭션 실패
        - `TIMED_OUT` — 처리 시간 초과

        **중간 상태**:
        - `PENDING` — 초기 상태
        - `PROCESSING` — 처리 중
        - `CANCEL_REQUESTED` — 취소 요청됨
        - `COMPENSATING` — 보상 처리 중
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - CANCEL_REQUESTED
        - COMPENSATING
        - CANCELLED
        - COMPENSATION_FAILED
        - TIMED_OUT

    # ── Wallet ─────────────────────────────────────
    WalletPointResponse:
      type: object
      properties:
        point:
          type: integer
          description: 현재 포인트 잔액

    # ── Inquiry ────────────────────────────────────
    CreateInquiryRequest:
      type: object
      required: [title, content, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
          description: 문의 제목 (공백 문자열 불가)
        content:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ".*\\S.*"
          description: 문의 내용 (공백 문자열 불가)
        category:
          $ref: '#/components/schemas/InquiryCategory'

    CreateInquiryResponse:
      type: object
      properties:
        inquiry_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/InquiryStatus'
        created_at:
          type: string
          format: date-time

    InquiryListResponse:
      type: object
      properties:
        inquiries:
          type: array
          items:
            $ref: '#/components/schemas/InquiryListItemResponse'
        total_count:
          type: integer
          format: int64
          description: 전체 문의 수
        total_pages:
          type: integer
          description: 전체 페이지 수
        current_page:
          type: integer
          description: 현재 페이지 번호 (0부터 시작)
        page_size:
          type: integer
          description: 페이지 크기

    InquiryListItemResponse:
      type: object
      properties:
        inquiry_id:
          type: integer
          format: int64
        title:
          type: string
        category:
          $ref: '#/components/schemas/InquiryCategory'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        created_at:
          type: string
          format: date-time

    InquiryDetailResponse:
      type: object
      properties:
        inquiry_id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          $ref: '#/components/schemas/InquiryCategory'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InquiryStatus:
      type: string
      description: |
        문의 처리 상태.
        - `RECEIVED` — 접수됨 (초기값)
        - `IN_PROGRESS` — 처리중
        - `COMPLETED` — 완료
      enum:
        - RECEIVED
        - IN_PROGRESS
        - COMPLETED

    InquiryCategory:
      type: string
      description: |
        문의 카테고리.
        - `PAYMENT` — 결제 관련
        - `ACCOUNT` — 계정 관련
        - `SERVICE` — 서비스 오류 관련
        - `OTHER` — 기타
      enum:
        - PAYMENT
        - ACCOUNT
        - SERVICE
        - OTHER

    ValidationErrorResponse:
      type: object
      description: 필드 유효성 검사 실패 시 반환되는 필드명-오류메시지 맵
      additionalProperties:
        type: string
      example:
        title: "제목을 입력해주세요."
        category: "카테고리를 선택해주세요."

    # ── Common ─────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: 오류 메시지
