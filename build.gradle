plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.10' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.10' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.10' apply false
    id 'org.springframework.boot' version '4.0.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'devcoop.occount'
version = '0.0.1-SNAPSHOT'

def kotlinVersion = '2.3.10'
def springBootVersion = '4.0.3'
def springCloudVersion = '2025.1.1'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${kotlinVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    kotlin {
        compilerOptions {
            freeCompilerArgs.addAll('-Xjsr305=strict')
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(Jar).configureEach {
        if (project.path == ':modules:db') {
            archiveBaseName.set('db-kiosk')
        } else {
            archiveBaseName.set(project.path.substring(1).replace(':', '-'))
        }
    }

    // member 도메인 모듈에만 JaCoCo 커버리지 적용 (-Pcoverage 옵트인).
    // JaCoCo 0.8.13은 JDK 26(major 70)을 지원하지 않으므로, 기본 빌드(JDK 26)를
    // 깨뜨리지 않도록 -Pcoverage 플래그가 있을 때만 적용한다. 커버리지는 JDK 21로 실행한다.
    if (project.path.startsWith(':domains:member') && project.hasProperty('coverage')) {
        apply plugin: 'jacoco'

        jacoco {
            toolVersion = '0.8.13'
        }

        tasks.withType(Test).configureEach {
            finalizedBy(tasks.named('jacocoTestReport'))
        }

        tasks.named('jacocoTestReport') {
            dependsOn(tasks.named('test'))
            reports {
                xml.required = true
                html.required = true
                csv.required = true
            }
        }
    }
}
