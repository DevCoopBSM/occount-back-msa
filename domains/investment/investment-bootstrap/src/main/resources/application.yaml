server:
  servlet:
    context-path: /api/v3

spring:
  application:
    name: investment-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&cacheServerConfiguration=true&rewriteBatchedStatements=true&useLocalSessionState=true&elideSetAutoCommits=true&maintainTimeStats=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 6
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 60000
      keepalive-time: 30000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

portone:
  secret-key: ${PORTONE_KEY:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}

app:
  startup-warmup:
    http-endpoints:
      - path: /api/v3/investments
        method: GET
        headers:
          X-Authenticated-User-Id: "0"

management:
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.client.requests]": true
  endpoints:
    web:
      exposure:
        include: health,prometheus
